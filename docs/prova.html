<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Prova Online</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.topo {
    position: sticky;
    top: 0;
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 15px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 100;
}

.topo h2 {
    margin: 0;
}

#cronometro {
    font-size: 20px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 20px;
}

.aluno {
    background: white;
    padding: 15px 20px;
    border-radius: 8px;
    margin-bottom: 20px;
}

.aviso {
    background: #fff4d6;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 20px;
}

.questao {
    background: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 8px;

    box-shadow:
        0 2px 7px
        rgba(0,0,0,0.08);
}

.questao h3 {
    margin-top: 0;
}

.codigo {
    background: #1e1e1e;
    color: #f5f5f5;

    padding: 18px;
    border-radius: 6px;

    overflow-x: auto;

    font-family:
        Consolas,
        monospace;

    white-space: pre-wrap;
    line-height: 1.5;
}

.alternativa {
    display: block;

    padding: 12px;
    margin: 8px 0;

    border: 1px solid #ddd;
    border-radius: 6px;

    cursor: pointer;
}

.alternativa:hover {
    background: #f0f4f8;
}

.alternativa input {
    margin-right: 10px;
}

.alternativa.salvando {
    opacity: 0.6;
}

.status-resposta {
    font-size: 12px;
    margin-top: 10px;
    min-height: 16px;
}

#btnEnviar {
    width: 100%;

    padding: 15px;
    margin: 10px 0 50px;

    border: none;
    border-radius: 7px;

    background: #1769aa;
    color: white;

    font-size: 18px;

    cursor: pointer;
}

#btnEnviar:hover {
    background: #12558a;
}

#btnEnviar:disabled {
    background: #999;
    cursor: not-allowed;
}

#mensagem {
    text-align: center;
    padding: 30px;
    font-size: 18px;
}

</style>

</head>


<body>


<header class="topo">

    <h2 id="titulo">
        Avaliação
    </h2>

    <div id="cronometro">
        --:--:--
    </div>

</header>


<main class="container">


    <div
        class="aluno"
        id="dadosAluno">
    </div>


    <div class="aviso">
        Leia atentamente todas as questões.
        A prova possui apenas uma tentativa.
        Suas respostas são salvas automaticamente.
    </div>


    <div id="questoes">

        <div id="mensagem">
            Preparando sua prova...
        </div>

    </div>


    <button
        id="btnEnviar"
        style="display:none;">

        Finalizar e enviar prova

    </button>


</main>


<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx9B-8lb3pzZrOOASFBIw0CfFjzRnPDG0PHrGU0EI3RvpyCcju78tFI5x7jOEAPXBQ/exec";


let prova = null;

let tempoRestante = 0;

let intervaloCronometro = null;

let finalizando = false;


/* =====================================================
   ALUNO
===================================================== */

const alunoSalvo =
    localStorage.getItem("aluno");


if (!alunoSalvo) {

    window.location.href =
        "index.html";

}


const aluno =
    JSON.parse(alunoSalvo);


document
    .getElementById("dadosAluno")
    .innerHTML =

    "<strong>Aluno:</strong> " +
    escapar(aluno.nome) +

    " &nbsp; | &nbsp; " +

    "<strong>Matrícula:</strong> " +
    escapar(aluno.matricula) +

    " &nbsp; | &nbsp; " +

    "<strong>Turma:</strong> " +
    escapar(aluno.turma);


/* =====================================================
   CARREGAR / RECUPERAR PROVA
===================================================== */

async function carregarProva() {

    try {

        const parametros =
            new URLSearchParams({

                acao:
                    "iniciarProva",

                nome:
                    aluno.nome,

                matricula:
                    aluno.matricula,

                turma:
                    aluno.turma,

                avaliacao:
                    aluno.avaliacao,

                /*
                 * Evita cache da requisição.
                 */

                t:
                    Date.now()

            });


        const resposta =
            await fetch(

                API_URL +
                "?" +
                parametros.toString(),

                {
                    cache: "no-store"
                }

            );


        const dados =
            await resposta.json();


        if (!dados.sucesso) {

            if (dados.finalizada) {

                mostrarProvaFinalizada();

                return;

            }

            throw new Error(
                dados.mensagem
            );

        }


        prova = dados;


        document
            .getElementById("titulo")
            .textContent =
            prova.avaliacao.nome;


        /*
         * As questões retornadas pelo servidor
         * já possuem "resposta" quando a prova
         * está sendo recuperada.
         */

        exibirQuestoes(
            prova.questoes
        );


        configurarCronometro();


        document
            .getElementById("btnEnviar")
            .style.display =
            "block";


    } catch (erro) {

        document
            .getElementById("questoes")
            .innerHTML =

            '<div id="mensagem">' +

            "Erro ao carregar a prova: " +

            escapar(erro.message) +

            "</div>";

    }

}


/* =====================================================
   EXIBIR QUESTÕES
===================================================== */

function exibirQuestoes(questoes) {

    const container =
        document.getElementById(
            "questoes"
        );


    container.innerHTML = "";


    questoes.forEach(
        (questao, indice) => {


        const bloco =
            document.createElement(
                "div"
            );


        bloco.className =
            "questao";


        let html =

            "<h3>Questão " +
            (indice + 1) +
            "</h3>" +

            "<p>" +
            escapar(
                questao.enunciado
            ) +
            "</p>";


        /*
         * Código da questão.
         */

        if (
            questao.codigo &&
            questao.codigo.trim() !== ""
        ) {

            html +=

                '<pre class="codigo">' +

                escapar(
                    questao.codigo
                ) +

                "</pre>";

        }


        /*
         * Alternativas.
         */

        for (
            const letra
            of ["A", "B", "C", "D"]
        ) {

            const texto =
                questao
                    .alternativas[letra];


            if (
                !texto ||
                texto.trim() === ""
            ) {

                continue;

            }


            /*
             * Se a resposta veio da
             * planilha, marca novamente.
             */

            const marcada =
                questao.resposta === letra
                    ? " checked"
                    : "";


            html +=

                '<label class="alternativa">' +

                '<input type="radio" ' +

                'name="questao_' +
                questao.id +
                '" ' +

                'value="' +
                letra +
                '"' +

                marcada +

                ">" +

                "<strong>" +
                letra +
                ")</strong> " +

                escapar(texto) +

                "</label>";

        }


        /*
         * Indicador de salvamento.
         */

        html +=

            '<div class="status-resposta" ' +

            'id="status_' +
            questao.id +
            '">' +

            (
                questao.resposta
                ? "Resposta salva."
                : ""
            ) +

            "</div>";


        bloco.innerHTML =
            html;


        container.appendChild(
            bloco
        );

    });


    /*
     * Cada mudança de alternativa
     * é enviada imediatamente.
     */

    document
        .querySelectorAll(
            '.questao input[type="radio"]'
        )
        .forEach(campo => {

            campo.addEventListener(
                "change",
                function() {

                    const idQuestao =
                        this.name.replace(
                            "questao_",
                            ""
                        );


                    salvarResposta(
                        idQuestao,
                        this.value
                    );

                }
            );

        });

}


/* =====================================================
   SALVAR RESPOSTA
===================================================== */

async function salvarResposta(
    idQuestao,
    respostaAluno
) {

    if (
        !prova ||
        !prova.idProva ||
        finalizando
    ) {

        return;

    }


    const status =
        document.getElementById(
            "status_" + idQuestao
        );


    if (status) {

        status.textContent =
            "Salvando...";

    }


    try {

        const parametros =
            new URLSearchParams({

                acao:
                    "salvarResposta",

                idProva:
                    prova.idProva,

                questao:
                    idQuestao,

                resposta:
                    respostaAluno,

                t:
                    Date.now()

            });


        const resposta =
            await fetch(

                API_URL +
                "?" +
                parametros.toString(),

                {
                    cache:
                        "no-store"
                }

            );


        const dados =
            await resposta.json();


        if (!dados.sucesso) {

            throw new Error(
                dados.mensagem
            );

        }


        /*
         * Atualiza também o objeto
         * local da prova.
         */

        const questao =
            prova.questoes.find(
                q =>
                    q.id === idQuestao
            );


        if (questao) {

            questao.resposta =
                respostaAluno;

        }


        if (status) {

            status.textContent =
                "Resposta salva.";

        }


    } catch (erro) {


        if (status) {

            status.textContent =
                "Erro ao salvar resposta.";

        }


        alert(
            "Não foi possível salvar esta resposta.\n\n" +
            erro.message
        );

    }

}


/* =====================================================
   CRONÔMETRO
===================================================== */

function configurarCronometro() {

    /*
     * Horário original registrado
     * na planilha.
     */

    const inicio =
        Number(prova.inicio);


    const tempoTotal =
        Number(
            prova.avaliacao.tempo
        ) * 60;


    const tempoDecorrido =
        Math.floor(

            (
                Date.now() -
                inicio
            )

            / 1000

        );


    tempoRestante =
        tempoTotal -
        tempoDecorrido;


    if (
        tempoRestante <= 0
    ) {

        tempoRestante = 0;

        atualizarCronometro();

        finalizarProva(true);

        return;

    }


    atualizarCronometro();


    intervaloCronometro =
        setInterval(
            function() {


                /*
                 * Recalcula pelo horário
                 * original, em vez de apenas
                 * diminuir uma variável.
                 */

                const decorrido =
                    Math.floor(

                        (
                            Date.now() -
                            inicio
                        )

                        / 1000

                    );


                tempoRestante =
                    tempoTotal -
                    decorrido;


                if (
                    tempoRestante <= 0
                ) {

                    tempoRestante = 0;

                    atualizarCronometro();

                    clearInterval(
                        intervaloCronometro
                    );

                    finalizarProva(true);

                    return;

                }


                atualizarCronometro();


            },

            1000

        );

}


/* =====================================================
   ATUALIZAR CRONÔMETRO
===================================================== */

function atualizarCronometro() {

    const valor =
        Math.max(
            0,
            tempoRestante
        );


    const horas =
        Math.floor(
            valor / 3600
        );


    const minutos =
        Math.floor(
            (
                valor % 3600
            ) / 60
        );


    const segundos =
        valor % 60;


    document
        .getElementById(
            "cronometro"
        )
        .textContent =

        String(horas)
            .padStart(2, "0") +

        ":" +

        String(minutos)
            .padStart(2, "0") +

        ":" +

        String(segundos)
            .padStart(2, "0");

}


/* =====================================================
   CONTAR RESPOSTAS
===================================================== */

function quantidadeRespondida() {

    if (!prova) {
        return 0;
    }


    return prova.questoes.filter(
        questao =>
            questao.resposta &&
            questao.resposta !== ""
    ).length;

}


/* =====================================================
   BOTÃO FINALIZAR
===================================================== */

document
    .getElementById(
        "btnEnviar"
    )
    .addEventListener(
        "click",
        function() {


            const respondidas =
                quantidadeRespondida();


            if (
                respondidas <
                prova.questoes.length
            ) {

                const continuar =
                    confirm(

                        "Você respondeu " +

                        respondidas +

                        " de " +

                        prova.questoes.length +

                        " questões.\n\n" +

                        "Deseja enviar mesmo assim?"

                    );


                if (!continuar) {

                    return;

                }

            }


            const confirmar =
                confirm(
                    "Deseja finalizar e enviar a prova?"
                );


            if (confirmar) {

                finalizarProva(false);

            }

        }
    );


/* =====================================================
   FINALIZAR
===================================================== */

async function finalizarProva(
    automatico
) {

    if (finalizando) {
        return;
    }


    finalizando = true;


    if (intervaloCronometro) {

        clearInterval(
            intervaloCronometro
        );

    }


    const botao =
        document.getElementById(
            "btnEnviar"
        );


    if (botao) {

        botao.disabled = true;

        botao.textContent =
            automatico
                ? "Tempo encerrado. Enviando..."
                : "Enviando...";

    }


    try {

        const parametros =
            new URLSearchParams({

                acao:
                    "finalizarProva",

                idProva:
                    prova.idProva,

                t:
                    Date.now()

            });


        const resposta =
            await fetch(

                API_URL +
                "?" +
                parametros.toString(),

                {
                    cache:
                        "no-store"
                }

            );


        const dados =
            await resposta.json();


        if (!dados.sucesso) {

            throw new Error(
                dados.mensagem
            );

        }


        /*
         * Somente após confirmação
         * do servidor apagamos o aluno.
         */

        localStorage.removeItem(
            "aluno"
        );


        document.body.innerHTML = `

            <div style="
                max-width:600px;
                margin:120px auto;
                font-family:Arial;
                text-align:center;
                background:white;
                padding:50px;
                border-radius:10px;
            ">

                <h1>
                    Prova enviada
                </h1>

                <p>
                    Suas respostas foram
                    registradas com sucesso.
                </p>

                <p>
                    Você pode fechar esta página.
                </p>

            </div>

        `;


    } catch (erro) {


        finalizando = false;


        alert(

            "Não foi possível enviar a prova.\n\n" +

            erro.message +

            "\n\nTente novamente."

        );


        if (botao) {

            botao.disabled =
                false;

            botao.textContent =
                "Finalizar e enviar prova";

        }


        /*
         * Se ainda houver tempo,
         * recarrega a prova do servidor.
         */

        if (tempoRestante > 0) {

            carregarProva();

        }

    }

}


/* =====================================================
   PROVA JÁ FINALIZADA
===================================================== */

function mostrarProvaFinalizada() {

    localStorage.removeItem(
        "aluno"
    );


    document.body.innerHTML = `

        <div style="
            max-width:600px;
            margin:120px auto;
            font-family:Arial;
            text-align:center;
            background:white;
            padding:50px;
            border-radius:10px;
        ">

            <h1>
                Avaliação já realizada
            </h1>

            <p>
                Esta matrícula já realizou
                esta avaliação.
            </p>

        </div>

    `;

}


/* =====================================================
   SEGURANÇA DE EXIBIÇÃO
===================================================== */

function escapar(texto) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto == null
            ? ""
            : String(texto);


    return div.innerHTML;

}


/* =====================================================
   INICIAR
===================================================== */

carregarProva();


</script>

</body>

</html>
