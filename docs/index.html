<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação I - Algoritmos</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header{
            background-color: #003366;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1{
            margin-bottom: 10px;
            font-size: 2rem;
        }

        main{
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .container{
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .container h2{
            margin-bottom: 25px;
            color: #003366;
        }

        .links{
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .links a{
            text-decoration: none;
            background-color: #0055aa;
            color: white;
            padding: 15px;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .links a:hover{
            background-color: #003f7f;
            transform: scale(1.03);
        }

        footer{
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Disciplina: Programação I</h1>
        <p>Conteúdo de Algoritmos</p>
        <p>Prof. Walbert Cunha Monteiro</p>
    </header>

    <main>
        <div class="container">

            <h2>Listas de Exercícios</h2>

            <div class="links">
                <a href="listaExercicios1.html">

                </a>

                <a href="listaExercicios02.html">
                    Lista de Exercícios 2
                </a>
            </div>

        </div>
    </main>

    <footer>
        <p>
            Desenvolvido por Prof. Walbert Cunha Monteiro
        </p>
    </footer>

</body>
</html>
